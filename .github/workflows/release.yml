name: Release — Sign & Publish
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
  id-token: write  # needed for cosign keyless signing
jobs:
  release:
    name: "Build, sign, and publish release"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install C build tools
        run: sudo apt-get install -y gcc build-essential
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: 'stable'
          cache: true
      - name: Build binary
        run: |
          VERSION="${GITHUB_REF_NAME}"
          mkdir -p dist
          # Build a FULLY STATIC binary so the release runs on any Linux
          # regardless of glibc. A dynamically-linked CGO binary built on the
          # runner's new glibc crashes on older servers (e.g. Ubuntu 20.04) and
          # breaks the in-app one-click updater that downloads it. netgo+osusergo
          # use Go's pure resolvers (no glibc NSS); -extldflags=-static links
          # libc/sqlite statically.
          CGO_ENABLED=1 GOTOOLCHAIN=auto go build \
            -trimpath -tags "netgo osusergo sqlite_omit_load_extension" \
            -ldflags="-s -w -linkmode external -extldflags '-static' -X main.Version=${VERSION#v}" \
            -o dist/vayupress ./cmd/vayupress
          file dist/vayupress
          if file dist/vayupress | grep -q "dynamically linked"; then
            echo "::error::release binary is dynamically linked — it would crash on older glibc"; exit 1
          fi
          sha256sum dist/vayupress > dist/vayupress.sha256
          echo "✅ built $VERSION (static)"
      - name: Install cosign
        continue-on-error: true
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign binary (keyless OIDC)
        continue-on-error: true
        run: |
          cosign sign-blob --yes dist/vayupress \
            --bundle dist/vayupress.cosign.bundle || echo "cosign skipped/failed — publishing without signature"
          echo "✅ sign step complete"
      - name: Generate SBOM (CycloneDX)
        # sbom.yml generates an SBOM as a CI artefact that expires with its run.
        # An SBOM exists to answer "what was in the version I deployed", and one
        # that has been garbage-collected cannot answer it. Attaching it here
        # ties the inventory to the exact binary. See docs/CRA-READINESS.md.
        run: |
          set -euo pipefail
          go install github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@latest
          "$(go env GOPATH)/bin/cyclonedx-gomod" mod \
            -output "dist/vayupress-${GITHUB_REF_NAME}.sbom.json" -json
          echo "✅ SBOM generated for ${GITHUB_REF_NAME}"
      - name: Sign the SBOM (keyless OIDC)
        continue-on-error: true
        # An unsigned SBOM next to a signed binary is a gap: swap the inventory
        # and the artefact still verifies.
        run: |
          cosign sign-blob --yes "dist/vayupress-${GITHUB_REF_NAME}.sbom.json" \
            --bundle "dist/vayupress-${GITHUB_REF_NAME}.sbom.cosign.bundle" \
            || echo "cosign SBOM signing skipped/failed — publishing SBOM without signature"
      - name: Upload release assets
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          # A semver pre-release tag (one containing a hyphen, e.g. v2.9.10-rc1)
          # is published as a GitHub *pre-release*, so it only appears in the
          # updater's "Include pre-release & development builds" channel and never
          # in the stable channel.
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: false
          files: |
            dist/vayupress
            dist/vayupress.sha256
            dist/vayupress.cosign.bundle
            dist/vayupress-${{ github.ref_name }}.sbom.json
            dist/vayupress-${{ github.ref_name }}.sbom.cosign.bundle
